---
- name: Configure intf name
  hosts: r2
  gather_facts: false
  tasks:
     - name: Configure archive log
       cisco.ios.ios_config:
         lines:
          - record rc
          - logging enable
         parents:
          - archive
          - log config
       register: archive_config
     - name: Configure archive path
       cisco.ios.ios_config:
         lines:
          - "path bootflash:"
         parents:
          - archive
       register: archive_config
  
 
     - name: Print Command Output
       ansible.builtin.debug:
         msg: "{{ archive_config }}"
